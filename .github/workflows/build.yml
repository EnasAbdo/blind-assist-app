name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev libltdl-dev libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev \
          autoconf automake libtool cmake zip unzip pkg-config meson ninja-build

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.36

    - name: Setup Android SDK Licenses & Force Build Tools
      run: |
        # 1. قبول التراخيص العامة في السيرفر
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # 2. إنشاء مجلد التراخيص الخاص بـ Buildozer مسبقاً لمنع خطأ الترخيص
        BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK_DIR/licenses"
        
        # نسخ التراخيص المقبولة إلى مجلد buildozer مباشرة
        cp -r $ANDROID_HOME/licenses/* "$BUILDOZER_SDK_DIR/licenses/" || true
        
        # 3. تثبيت build-tools 31.0.0 المستقرة وتجهيزها داخل Buildozer SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$BUILDOZER_SDK_DIR "build-tools;31.0.0" "platforms;android-31" || true

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blindassist-app-debug
        path: bin/*.apk
