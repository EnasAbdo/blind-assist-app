name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev libltdl-dev libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev \
          autoconf automake libtool cmake zip unzip pkg-config meson ninja-build

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        pip install cython==0.29.36 buildozer

    - name: Setup Android SDK with Official Action
      uses: android-actions/setup-android@v3

    - name: Link SDK Paths & Pre-accept Licenses
      run: |
        BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK"
        
        # 1. قبول كل التراخيص فوراً
        yes | sdkmanager --licenses || true

        # 2. تثبيت build-tools و platform المطلوبة
        yes | sdkmanager "build-tools;31.0.0" "platforms;android-31" "platform-tools" || true

        # 3. عمل رابط مجازي (Symlink) بين SDK النظام المكتمل ومجلد Buildozer لتجنب تنزيل SDK جديد مكسور
        ln -sfn $ANDROID_HOME/* "$BUILDOZER_SDK/" || true
        
        # 4. خدعة المسار القديم: إنشاء tools/bin وربط sdkmanager فيها ليفهمها buildozer
        mkdir -p "$BUILDOZER_SDK/tools/bin"
        ln -sfn $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$BUILDOZER_SDK/tools/bin/sdkmanager" || true

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blindassist-app-debug
        path: bin/*.apk
