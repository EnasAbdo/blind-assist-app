name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Clean previous build cache
      run: |
        sudo rm -rf .buildozer bin/

    - name: Build APK using Official Kivy Buildozer Docker Image
      run: |
        docker run --rm \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          -v ${{ github.workspace }}:/home/user/hostpython \
          -w /home/user/hostpython \
          kivy/buildozer \
          android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blindassist-app-debug
        path: bin/*.apk
