name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev libltdl-dev libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev \
          autoconf automake libtool cmake zip unzip pkg-config meson ninja-build

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.36

    - name: Build APK with Buildozer
      run: |
        # إعطاء أمر تلقائي للموافقة على شروط وتراخيص Buildozer أثناء البناء
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blindassist-app-debug
        path: bin/*.apk
